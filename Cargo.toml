[package]
name = "cmapaperbot"
version = "0.1.0"
edition = "2021"
authors = ["Abhinandh S"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = [] }
worker-macros = { version = "0.8", features = [] }
serde = { version = "1", features = ["derive"] }

tracing = "0.1"
tracing-web = "0.1"
tracing-subscriber = { version = "0.3", features = ['time', 'json'] }
time = { version = "0.3", features = ['wasm-bindgen'] }

[profile.release]
opt-level = "s"
lto = true
strip = false # must
codegen-units = 1